<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대구 영유아 돌봄 인프라 분석</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --ink: #16202a;
        --ink-2: #2c3b48;
        --sub: #5f6c76;
        --faint: #949ea6;
        --paper: #f5f7f7;
        --card: #ffffff;
        --rule: #e4e8e8;
        --signal: #b3271e;
        --mono: "Pretendard", -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Pretendard",
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── 상단 ── */
      .bar {
        background: var(--ink);
        color: #fff;
        padding: 13px 26px;
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex: none;
      }
      .bar h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .bar .src {
        font-size: 12px;
        color: #9fb0bd;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex: none;
        margin-bottom: 16px;
        margin-left: 53px;
      }
      .stats > * {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 9px;
        padding: 8px 14px;
        text-align: left;
        font: inherit;
        color: inherit;
        min-width: 96px;
      }
      .stats button {
        cursor: pointer;
        transition: 0.15s;
      }
      .stats button:hover {
        border-color: var(--signal);
      }
      .stats button[aria-expanded="true"] {
        border-color: var(--signal);
        background: #fdf3f2;
      }
      .lb {
        font-size: 11px;
        color: var(--faint);
        margin-bottom: 2px;
      }
      .vl {
        font-size: 21px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.5px;
      }

      /* ── 본문 ── */
      .wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--card);
        border-top: 1px solid var(--rule);
      }
      .col {
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      /* 2×2 매트릭스 */
      .mx {
        display: grid;
        grid-template-columns: 46px 1fr 1fr;
        grid-template-rows: 22px 1fr 1fr;
        gap: 7px;
        flex: none;
      }
      /* ▼ 축 라벨: 검정 + 위→아래 정방향 */
      .ax {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .ax.v {
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 1px;
      }

      .q {
        border: 0;
        background: var(--card);
        border-radius: 9px;
        padding: 14px 12px;
        text-align: center;
        cursor: pointer;
        font: inherit;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: 0.15s;
      }
      .q:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(22, 32, 42, 0.18);
      }
      .q[aria-pressed="true"] {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .q .n {
        font-family: var(--mono);
        font-size: 25px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -1px;
      }
      .q .n small {
        font-size: 11px;
        font-weight: 500;
        margin-left: 2px;
        color: rgba(255, 255, 255, 0.75);
      }
      .q .nm {
        font-size: 12.5px;
        font-weight: 700;
      }
      .q .ds {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.88);
        line-height: 1.42;
        text-align: center;
      }
      .q.good {
        background: #dcefe1;
        color: #1f6b3d;
      }
      .q.good .n small {
        color: var(--faint);
      }
      .q.good .ds {
        color: var(--sub);
      }
      .q.qual {
        background: #1d4ed8;
      }
      .q.phys {
        background: #4f86f0;
      }
      .q.dbl {
        background: #c42b2b;
      }

      .keys {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 13px;
        font-size: 11px;
        color: var(--sub);
        flex: none;
      }
      .keys span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .keys i {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      /* 완전공백 목록 */
      .drill {
        margin-top: 10px;
        width: 300px;
        max-width: 100%;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 11px;
        padding: 14px 16px;
        box-shadow: 0 10px 28px rgba(22, 32, 42, 0.14);
      }
      .drill:not([hidden]) {
        display: block;
      }
      .drill .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .drill h3 {
        margin: 0;
        font-size: 13px;
      }
      .closebtn {
        border: 0;
        background: none;
        color: var(--faint);
        cursor: pointer;
        font-size: 11px;
      }
      .cap {
        margin: 0 0 8px;
        font-size: 11.5px;
        color: var(--sub);
        line-height: 1.5;
      }
      .bi {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        border-top: 1px solid var(--rule);
        padding: 8px 0;
        font-size: 12.5px;
      }
      .bi .loc {
        font-weight: 700;
      }
      .bi .bipop {
        color: var(--sub);
        white-space: nowrap;
      }

      /* ── 지도 ── */
      .maphead {
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex: none;
        z-index: 5;
        background: var(--card);
      }
      .maphead h2 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 700;
      }
      .maphead .sub {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 2px;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chk {
        font-size: 11.5px;
        color: var(--sub);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      select {
        border: 1px solid var(--rule);
        background: var(--card);
        border-radius: 7px;
        padding: 5px 9px;
        font: inherit;
        font-size: 11.5px;
        color: var(--ink-2);
        cursor: pointer;
      }

      .stage {
        flex: 1;
        min-height: 0;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── 지도 위 오버레이 패널 (매트릭스: 좌측 상단 / 통계: 우측 상단) ── */
      .panel {
        position: absolute;
        top: 78px;
        z-index: 15;
        max-width: 340px;
      }
      .panel-matrix {
        left: 20px;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(22, 32, 42, 0.14);
        padding: 16px 17px;
        max-height: calc(100% - 98px);
        overflow: auto;
      }
      .panel-stats {
        right: 20px;
      }
      .panel-stats .stats {
        margin: 0;
      }
      .panel-stats .stats > * {
        box-shadow: 0 6px 18px rgba(22, 32, 42, 0.1);
      }
      svg.gumap {
        width: 100%;
        height: 100%;
      }
      .gu path {
        stroke: #fff;
        stroke-width: 3;
        cursor: pointer;
        transition: 0.16s;
      }
      .gu:hover path {
        stroke: var(--ink);
        stroke-width: 4;
      }
      .gu.on path {
        stroke: var(--ink);
        stroke-width: 4.5;
      }
      .lbl {
        cursor: pointer;
      }
      .lbl text {
        pointer-events: none;
        text-anchor: middle;
        fill: var(--ink);
      }
      .lbl rect {
        pointer-events: none;
      }
      .gname {
        font-size: 21px;
        font-weight: 700;
      }
      .gnum {
        font-size: 14px;
        font-family: var(--mono);
        opacity: 0.65;
      }

      /* 동 팝업 */
      .pop {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(760px, calc(100% - 40px));
        max-height: calc(100% - 70px);
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 13px;
        box-shadow: 0 14px 40px rgba(22, 32, 42, 0.22);
        display: none;
        flex-direction: column;
        z-index: 20;
      }
      .pop[data-open] {
        display: flex;
      }
      .pophead {
        padding: 13px 16px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pophead h3 {
        margin: 0;
        font-size: 16px;
      }
      .pophead .cnt {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 2px;
      }
      .popbody {
        padding: 13px 16px 16px;
        overflow: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 8px;
      }
      .dt {
        border: 0;
        border-radius: 9px;
        padding: 10px 10px 9px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: #fff;
        display: flex;
        flex-direction: column;
        gap: 3px;
        transition: 0.14s;
        min-height: 70px;
      }
      .dt:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(22, 32, 42, 0.18);
      }
      .dt[aria-pressed="true"] {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .dt .dn {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .dt .dl {
        font-size: 10.5px;
        opacity: 0.9;
      }
      .dt .dp {
        font-size: 10.5px;
        font-family: var(--mono);
        opacity: 0.86;
        margin-top: auto;
      }
      .dt.pale {
        color: var(--ink);
      }
      .dt.pale .dl,
      .dt.pale .dp {
        opacity: 0.72;
      }

      .gu-shape-wrap {
        width: 100%;
        height: 62vh;
        max-height: 460px;
        min-height: 300px;
      }
      .gu-shape-map {
        width: 100%;
        height: 100%;
      }
      .gu-shape-map .dong-piece {
        stroke: #fff;
        cursor: pointer;
        transition: filter 0.12s;
      }
      .gu-shape-map .dong-piece:hover {
        filter: brightness(0.92);
      }
      .gu-shape-map .dong-piece.sel {
        filter: brightness(0.82);
      }
      .gu-shape-map .dong-label {
        pointer-events: none;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 700;
        fill: var(--ink);
        paint-order: stroke;
        stroke: #fff;
        stroke-linejoin: round;
      }

      .veil {
        position: absolute;
        inset: 0;
        background: rgba(22, 32, 42, 0.12);
        display: none;
        z-index: 10;
      }
      .veil[data-open] {
        display: block;
      }

      /* ── 상세 ── */
      .detail {
        position: absolute;
        top: 160px;
        right: 20px;
        z-index: 16;
        width: 300px;
        max-height: calc(100% - 180px);
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 11px;
        box-shadow: 0 10px 28px rgba(22, 32, 42, 0.14);
        padding: 15px 16px;
        overflow: auto;
        min-height: 0;
        display: none;
      }
      .wrap[data-detail] .detail {
        display: block;
      }
      .detail .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .detail h3 {
        margin: 0 0 2px;
        font-size: 15.5px;
      }
      .detail .badge {
        display: inline-block;
        color: #fff;
        border-radius: 5px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 700;
        margin: 7px 0 12px;
      }
      .rows {
        border-top: 1px solid var(--rule);
      }
      .rw {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
        font-size: 12px;
      }
      .rw span:first-child {
        color: var(--sub);
      }
      .rw span:last-child {
        font-family: var(--mono);
        font-weight: 600;
      }

      .demo {
        position: fixed;
        right: 14px;
        bottom: 12px;
        background: #fff4e5;
        border: 1px solid #f0d3a8;
        color: #8a5a12;
        font-size: 11.5px;
        padding: 6px 11px;
        border-radius: 7px;
        display: none;
        z-index: 50;
      }

      @media (max-width: 1100px) {
        body {
          overflow: auto;
        }
        .wrap {
          overflow: visible;
        }
        .panel {
          position: static;
          max-width: none;
          margin: 12px 16px 0;
        }
        .detail {
          position: static;
          width: auto;
          max-height: none;
          margin: 12px 16px 0;
        }
        .stage {
          min-height: 460px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>대구 영유아 돌봄 인프라 분석</h1>
      <span class="src">읍면동 단위 · 공공데이터 기반</span>
    </div>

    <div class="wrap" id="wrap">
      <div class="maphead">
        <div>
          <h2 id="mapTitle">대구광역시</h2>
          <div class="sub" id="mapSub">
            구·군을 누르면 그 안의 동이 나옵니다
          </div>
        </div>
        <div class="tools">
          <label class="chk"
            ><input type="checkbox" id="gunwi" /> 군위군 포함</label
          >
          <select id="typeFilter">
            <option value="">전체 유형</option>
            <option value="완전공백">시설 없음</option>
            <option value="이중취약">이중 취약</option>
            <option value="물리적부족">수요초과형</option>
            <option value="질적미스매치">공급초과형</option>
            <option value="양호">양호</option>
            <option value="판정불가">판정 보류</option>
          </select>
        </div>
      </div>

      <div class="stage" id="stage">불러오는 중…</div>

      <!-- 좌측 상단 오버레이: 4분면 매트릭스 -->
      <div class="panel panel-matrix">
        <div class="mx">
          <div></div>
          <div class="ax">커버율 높음</div>
          <div class="ax">커버율 낮음</div>

          <div class="ax v">충원율 높음</div>
          <button class="q good" data-type="양호" aria-pressed="false">
            <span class="n" id="cnt-양호">–<small>곳</small></span>
            <span class="nm">양호</span>
            <span class="ds">자리도 넉넉하고 잘 이용합니다</span>
          </button>
          <button class="q phys" data-type="물리적부족" aria-pressed="false">
            <span class="n" id="cnt-물리적부족">–<small>곳</small></span>
            <span class="nm">수요초과형</span>
            <span class="ds">자리가 모자라 이미 꽉 찼습니다</span>
          </button>

          <div class="ax v">충원율 낮음</div>
          <button class="q qual" data-type="질적미스매치" aria-pressed="false">
            <span class="n" id="cnt-질적미스매치">–<small>곳</small></span>
            <span class="nm">공급초과형</span>
            <span class="ds">자리는 있는데 아이가 가지 않습니다</span>
          </button>
          <button class="q dbl" data-type="이중취약" aria-pressed="false">
            <span class="n" id="cnt-이중취약">–<small>곳</small></span>
            <span class="nm">이중 취약</span>
            <span class="ds">자리도 적고 이용도 저조합니다</span>
          </button>
        </div>

        <div class="keys">
          <span><i style="background: #7a1414"></i>시설 없음</span>
          <span><i style="background: #c42b2b"></i>이중 취약</span>
          <span><i style="background: #4f86f0"></i>수요초과형</span>
          <span><i style="background: #1d4ed8"></i>공급초과형</span>
          <span
            ><i style="background: #dcefe1; border: 1px solid var(--rule)"></i
            >양호</span
          >
          <span><i style="background: #cbd0ce"></i>판정 보류</span>
        </div>
      </div>

      <!-- 우측 상단 오버레이: 통계 -->
      <div class="panel panel-stats">
        <div class="stats">
          <div>
            <div class="lb">분석 대상 동</div>
            <div class="vl" id="kpi-total">–</div>
          </div>
          <button id="blankBtn" aria-expanded="false">
            <div class="lb">시설 없음</div>
            <div class="vl" id="kpi-blank">–</div>
          </button>
          <div>
            <div class="lb">평균 충원율</div>
            <div class="vl" id="kpi-fill">–</div>
          </div>
        </div>

        <div class="drill" id="drill" hidden>
          <div class="top">
            <h3>시설이 한 곳도 없는 지역</h3>
            <button class="closebtn" id="drillClose">닫기</button>
          </div>
          <p class="cap">
            숫자만으로는 모두 같은 “공백”이지만, 배경은 서로 다릅니다.
          </p>
          <div id="blankList"></div>
        </div>
      </div>

      <!-- 동 상세 (선택 시 우측에 표시) -->
      <div class="detail" id="detail"></div>

      <div class="veil" id="veil"></div>
      <div class="pop" id="pop">
        <div class="pophead">
          <div>
            <h3 id="popTitle">—</h3>
            <div class="cnt" id="popCnt"></div>
          </div>
          <button class="closebtn" id="popClose">닫기 ✕</button>
        </div>
        <div class="popbody"><div id="popGrid"></div></div>
      </div>
    </div>

    <div class="demo" id="demo">시안 미리보기 — 샘플 데이터로 표시 중</div>

    <script>
      const TYPE_COLORS = {
        완전공백: "#7A1414",
        이중취약: "#C42B2B",
        물리적부족: "#4F86F0",
        질적미스매치: "#1D4ED8",
        양호: "#DCEFE1",
        판정불가: "#CBD0CE",
      };
      const LABEL = {
        완전공백: "시설 없음",
        이중취약: "이중 취약",
        물리적부족: "수요초과형",
        질적미스매치: "공급초과형",
        양호: "양호",
        판정불가: "판정 보류",
      };
      const PALE = new Set(["양호", "판정불가"]);
      const WEAK = new Set(["완전공백", "이중취약", "물리적부족"]);

      /* ── 대구 구·군 실제 행정경계 ── */

            x +
            '" y="' +
            (y - 2) +
            '">' +
            gu +
            "</text>" +
            '<text class="gnum" x="' +
            x +
            '" y="' +
            (y + 16) +
            '">' +
            n +
            "곳</text></g>";
        });
        s += "</svg>";

        $("stage").innerHTML = s;
        $("stage")
          .querySelectorAll("[data-gu]")
          .forEach((g) =>
            g.addEventListener("click", () => openGu(g.dataset.gu)),
          );

        const type = $("typeFilter").value;
        $("mapSub").textContent = type
          ? "색이 진할수록 \u2018" + LABEL[type] + "\u2019 동이 많습니다"
          : "색이 진할수록 손봐야 할 동이 많습니다 · 구·군을 누르면 동이 나옵니다";
      }

      /* ── 동 팝업 ── */
      /* ── 동 팝업: 실제 읍면동 경계(폴리곤) 그대로 표시 ──
         daegu_map.json(SGIS 읍면동 경계, 투영좌표계) 폴리곤을 단순화(허용오차 40m)해
         DONG_SHAPES에 미리 계산해 두었다. y좌표만 부호를 반전(-y)해서 SVG 좌표계
         (아래로 증가)에 맞췄을 뿐, 별도의 스케일/회전 보정 없이 원본 좌표를 그대로
         쓴다 — 그래서 왜곡 없이 실제 형태·비율 그대로 나온다. */

      function openGu(gu) {
        curGu = gu;
        const rows = visible().filter((r) => r["시군구명"] === gu);
        rows.sort(
          (a, b) => (b["영유아인구_0_6세"] || 0) - (a["영유아인구_0_6세"] || 0),
        );

        $("popTitle").textContent = gu;
        $("popCnt").textContent = rows.length + "개 동 · 실제 경계";

        let minX = Infinity,
          maxX = -Infinity,
          minY = Infinity,
          maxY = -Infinity;
        let pieces = "";

        rows.forEach((r) => {
          const shape = DONG_SHAPES[gu + "|" + r["읍면동명"]];
          if (!shape) return;
          const t = r["미스매치_유형"];
          const c = TYPE_COLORS[t] || "#CBD0CE";
          const title =
            r["읍면동명"] +
            " · " +
            (LABEL[t] || t) +
            " · 영유아 " +
            num(r["영유아인구_0_6세"]) +
            "명";
          pieces +=
            '<path class="dong-piece" data-dong="' +
            r["읍면동명"] +
            '" fill="' +
            c +
            '" d="' +
            shape.d +
            '"><title>' +
            title +
            "</title></path>";

          (shape.d.match(/-?\d+,-?\d+/g) || []).forEach((p) => {
            const [x, y] = p.split(",").map(Number);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          });
        });

        let vb = "0 0 100 100",
          vbWidth = 100;
        if (isFinite(minX)) {
          const padX = (maxX - minX) * 0.08 || 20;
          const padY = (maxY - minY) * 0.08 || 20;
          vbWidth = maxX - minX + padX * 2;
          const vbHeight = maxY - minY + padY * 2;
          vb =
            (minX - padX).toFixed(0) +
            " " +
            (minY - padY).toFixed(0) +
            " " +
            vbWidth.toFixed(0) +
            " " +
            vbHeight.toFixed(0);
        }
        // 좌표 단위가 미터라 스케일이 커서, 획 두께/글자 크기를 그 구의 실제 폭에
        // 비례해 정해야 구마다(작은 도심구 vs 넓은 군위군) 화면상 굵기가 일정해 보인다.
        const strokeW = Math.max(60, vbWidth / 500);
        const fontSize = Math.max(500, vbWidth / 48);
        const haloW = fontSize / 6;

        let labels = "";
        rows.forEach((r) => {
          const shape = DONG_SHAPES[gu + "|" + r["읍면동명"]];
          if (!shape) return;
          labels +=
            '<text class="dong-label" x="' +
            shape.c[0] +
            '" y="' +
            shape.c[1] +
            '" font-size="' +
            fontSize.toFixed(0) +
            '" stroke-width="' +
            haloW.toFixed(0) +
            '">' +
            r["읍면동명"] +
            "</text>";
        });

        $("popGrid").innerHTML = rows.length
          ? '<div class="gu-shape-wrap"><svg class="gu-shape-map" viewBox="' +
            vb +
            '" role="img" aria-label="' +
            gu +
            ' 지도"><g stroke-width="' +
            strokeW.toFixed(0) +
            '">' +
            pieces +
            "</g>" +
            labels +
            "</svg></div>"
          : '<div style="color:var(--faint);font-size:12.5px">이 조건에 맞는 동이 없습니다.</div>';

        $("popGrid")
          .querySelectorAll(".dong-piece")
          .forEach((p) =>
            p.addEventListener("click", () => openDong(p.dataset.dong)),
          );

        $("pop").setAttribute("data-open", "");
        $("veil").setAttribute("data-open", "");
        renderMap();
      }
      function closePop() {
        curGu = null;
        $("pop").removeAttribute("data-open");
        $("veil").removeAttribute("data-open");
        renderMap();
      }

      /* ── 동 상세 (평당가 제외) ── */
      function openDong(name) {
        const r = allDong.find(
          (x) => x["시군구명"] === curGu && x["읍면동명"] === name,
        );
        if (!r) return;
        curDong = name;
        const t = r["미스매치_유형"];
        const row = (k, v) =>
          '<div class="rw"><span>' + k + "</span><span>" + v + "</span></div>";

        $("detail").innerHTML =
          '<div class="top"><div><h3>' +
          r["읍면동명"] +
          '</h3><div style="font-size:11.5px;color:var(--faint)">' +
          r["시군구명"] +
          '</div></div><button class="closebtn" id="detailClose">닫기 ✕</button></div>' +
          '<span class="badge" style="background:' +
          (TYPE_COLORS[t] || "#CBD0CE") +
          (PALE.has(t) ? ";color:#16202A" : "") +
          '">' +
          (LABEL[t] || t) +
          "</span>" +
          '<div class="rows">' +
          row("영유아(0-6세)", num(r["영유아인구_0_6세"]) + "명") +
          row("영아(0-2세)", num(r["영아인구_0_2세"]) + "명") +
          row("유아(3-6세)", num(r["유아인구_3_6세"]) + "명") +
          row("유치원", (r["유치원수"] || 0) + "곳") +
          row("어린이집", (r["어린이집수"] || 0) + "곳") +
          row("체육시설", (r["체육시설수"] || 0) + "곳") +
          row(
            "아이 대비 자리",
            r["전체_커버율"] != null ? pct(r["전체_커버율"]) : "-",
          ) +
          row(
            "자리 충원",
            r["전체_충원율"] != null ? pct(r["전체_충원율"]) : "-",
          ) +
          "</div>";

        $("wrap").setAttribute("data-detail", "");
        $("detailClose").addEventListener("click", closeDetail);
        markSelected();
      }
      function closeDetail() {
        curDong = null;
        $("wrap").removeAttribute("data-detail");
        markSelected();
      }
      function markSelected() {
        document
          .querySelectorAll(".dong-piece")
          .forEach((p) =>
            p.classList.toggle("sel", p.dataset.dong === curDong),
          );
      }

      /* ── 유형 필터 ── */
      function setType(type) {
        $("typeFilter").value = type;
        if (type === "완전공백") $("gunwi").checked = true;
        closeDetail();
        closePop();
      }
      function highlightQuadrant(btn) {
        const on = btn.getAttribute("aria-pressed") === "true";
        document
          .querySelectorAll(".q")
          .forEach((q) => q.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", String(!on));
        closeDrill(false);
        setType(on ? "" : btn.dataset.type);
      }

      /* ── 시설 없음 목록 ── */
      function openDrill() {
        const rows = allDong.filter((r) => r["미스매치_유형"] === "완전공백");
        $("blankList").innerHTML =
          rows
            .map(
              (r) =>
                '<div class="bi"><span class="loc">' +
                r["시군구명"] +
                " " +
                r["읍면동명"] +
                '</span><span class="bipop">영유아 ' +
                num(r["영유아인구_0_6세"]) +
                "명</span></div>",
            )
            .join("") || '<div class="bi">해당 지역 없음</div>';
        $("drill").hidden = false;
        $("blankBtn").setAttribute("aria-expanded", "true");
        document
          .querySelectorAll(".q")
          .forEach((q) => q.setAttribute("aria-pressed", "false"));
        setType("완전공백");
      }
      function closeDrill(reset) {
        if ($("drill").hidden) return;
        $("drill").hidden = true;
        $("blankBtn").setAttribute("aria-expanded", "false");
        if (reset !== false) setType("");
      }

      /* ── 데이터 ── */
      const SAMPLE_GU = {
        중구: 12,
        동구: 22,
        서구: 17,
        남구: 13,
        북구: 23,
        수성구: 23,
        달서구: 23,
        달성군: 9,
        군위군: 8,
      };
      const TYPES = [
        "양호",
        "질적미스매치",
        "물리적부족",
        "이중취약",
        "판정불가",
        "완전공백",
      ];
      function makeSample() {
        const out = [];
        let seed = 7;
        const rnd = () =>
          (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        Object.entries(SAMPLE_GU).forEach(([gu, n]) => {
          for (let i = 1; i <= n; i++) {
            const t = TYPES[Math.floor(rnd() * 4)];
            const pop = Math.round(50 + rnd() * 900);
            out.push({
              시군구명: gu,
              읍면동명: gu.replace(/[구군]$/, "") + i + "동",
              영유아인구_0_6세: pop,
              영아인구_0_2세: Math.round(pop * 0.4),
              유아인구_3_6세: Math.round(pop * 0.6),
              유치원수: Math.round(rnd() * 4),
              어린이집수: Math.round(rnd() * 9),
              체육시설수: Math.round(rnd() * 8),
              전체_커버율: 0.3 + rnd() * 1.5,
              전체_충원율: 0.35 + rnd() * 0.6,
              미스매치_유형: t,
            });
          }
        });
        ["비산6동", "우보면", "산성면", "삼국유사면"].forEach((d, i) => {
          out.push({
            시군구명: i === 0 ? "서구" : "군위군",
            읍면동명: d,
            영유아인구_0_6세: [58, 23, 17, 3][i],
            영아인구_0_2세: 0,
            유아인구_3_6세: 0,
            유치원수: 0,
            어린이집수: 0,
            체육시설수: 0,
            전체_커버율: 0,
            전체_충원율: null,
            미스매치_유형: "완전공백",
          });
        });
        return out;
      }

      const CORE_MATRIX_TYPES = [
        "양호",
        "질적미스매치",
        "물리적부족",
        "이중취약",
      ];

      function fillKpi() {
        const cnt = {};
        allDong.forEach((r) => {
          cnt[r["미스매치_유형"]] = (cnt[r["미스매치_유형"]] || 0) + 1;
        });
        $("kpi-total").textContent = allDong.length;
        $("kpi-blank").textContent = cnt["완전공백"] || 0;
        CORE_MATRIX_TYPES.forEach((t) => {
          const el = $("cnt-" + t);
          if (el) el.innerHTML = (cnt[t] || 0) + "<small>곳</small>";
        });
        const f = allDong.filter((r) => r["전체_충원율"] != null);
        $("kpi-fill").textContent = pct(
          f.reduce((a, r) => a + r["전체_충원율"], 0) / f.length,
        );
      }

      async function load() {
        try {
          const res = await fetch("/api/dong");
          if (!res.ok) throw new Error();
          allDong = await res.json();
        } catch {
          allDong = makeSample();
          $("demo").style.display = "block";
        }
        fillKpi();
        renderMap();
      }

      /* ── 이벤트 ── */
      document
        .querySelectorAll(".q")
        .forEach((b) =>
          b.addEventListener("click", () => highlightQuadrant(b)),
        );
      $("typeFilter").addEventListener("change", () => {
        document
          .querySelectorAll(".q")
          .forEach((q) => q.setAttribute("aria-pressed", "false"));
        closeDetail();
        closePop();
      });
      $("gunwi").addEventListener("change", () => {
        closeDetail();
        closePop();
      });
      $("popClose").addEventListener("click", closePop);
      $("veil").addEventListener("click", closePop);
      $("blankBtn").addEventListener("click", () =>
        $("drill").hidden ? openDrill() : closeDrill(),
      );
      $("drillClose").addEventListener("click", () => closeDrill());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closePop();
          closeDetail();
        }
      });

      load();
    </script>
  </body>
</html>
