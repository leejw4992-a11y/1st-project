<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대구 영유아 돌봄 인프라 분석</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --ink: #16202a;
        --ink-2: #2c3b48;
        --sub: #5f6c76;
        --faint: #949ea6;
        --paper: #f5f7f7;
        --card: #ffffff;
        --rule: #e4e8e8;
        --signal: #b3271e;
        --mono: "Pretendard", -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Pretendard",
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── 상단 ── */
      .bar {
        background: var(--ink);
        color: #fff;
        padding: 14px 26px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex: none;
      }
      .titlewrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .bar h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1;
      }
      .bar .src {
        font-size: 26px;
        color: #9fb0bd;
        line-height: 1;
      }

      .stats {
        display: flex;
        gap: 10px;
        flex: none;
        margin-bottom: 16px;
        margin-left: 53px;
      }
      .stats > * {
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 9px;
        padding: 8px 14px;
        text-align: left;
        font: inherit;
        color: inherit;
        min-width: 96px;
      }
      .stats button {
        cursor: pointer;
        transition: 0.15s;
      }
      .stats button:hover {
        border-color: var(--signal);
      }
      .stats button[aria-expanded="true"] {
        border-color: var(--signal);
        background: #fdf3f2;
      }
      .lb {
        font-size: 11px;
        color: var(--faint);
        margin-bottom: 2px;
      }
      .vl {
        font-size: 21px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.5px;
      }

      /* ── 본문 ── */
      .wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--card);
      }
      .col {
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      /* 2×2 매트릭스 */
      .mx {
        display: grid;
        grid-template-columns: 40px 1fr 1fr;
        grid-template-rows: 18px 1fr 1fr;
        gap: 6px;
        flex: none;
      }
      /* ▼ 축 라벨: 검정 + 위→아래 정방향 */
      .ax {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .ax.v {
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 1px;
      }

      .q {
        border: 0;
        background: var(--card);
        border-radius: 9px;
        padding: 9px 10px;
        text-align: center;
        cursor: pointer;
        font: inherit;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        transition: 0.15s;
      }
      .q:hover {
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(22, 32, 42, 0.18);
      }
      .q[aria-pressed="true"] {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .q .n {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -1px;
      }
      .q .n small {
        font-size: 11px;
        font-weight: 500;
        margin-left: 2px;
        color: rgba(255, 255, 255, 0.75);
      }
      .q .nm {
        font-size: 12.5px;
        font-weight: 700;
      }
      .q .ds {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.88);
        line-height: 1.25;
        text-align: center;
      }
      .q.good {
        background: #dcefe1;
        color: #1f6b3d;
      }
      .q.good .n small {
        color: var(--faint);
      }
      .q.good .ds {
        color: var(--sub);
      }
      .q.phys {
        background: #fde4c4;
        color: #a85a00;
      }
      .q.phys .n small {
        color: #c98a3d;
      }
      .q.phys .ds {
        color: #a85a00;
        opacity: 0.85;
      }
      .q.qual {
        background: #e1dffb;
        color: #4b3fa0;
      }
      .q.qual .n small {
        color: #7d72c9;
      }
      .q.qual .ds {
        color: #4b3fa0;
        opacity: 0.85;
      }
      .q.dbl {
        background: #fbd8d8;
        color: #a32d2d;
      }
      .q.dbl .n small {
        color: #c46a6a;
      }
      .q.dbl .ds {
        color: #a32d2d;
        opacity: 0.85;
      }

      .keys {
        margin-top: 9px;
        margin-bottom: 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 13px;
        font-size: 11px;
        color: var(--sub);
        flex: none;
      }
      .keys span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .keys i {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      /* 완전공백 목록 */
      .drill {
        margin-top: 9px;
        width: 300px;
        max-width: 100%;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 11px;
        padding: 11px 14px;
        box-shadow: 0 10px 28px rgba(22, 32, 42, 0.14);
      }
      .drill:not([hidden]) {
        display: block;
      }
      .drill .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }
      .drill h3 {
        margin: 0;
        font-size: 13px;
      }
      .closebtn {
        border: 0;
        background: none;
        color: var(--faint);
        cursor: pointer;
        font-size: 11px;
      }
      .cap {
        margin: 0 0 8px;
        font-size: 11.5px;
        color: var(--sub);
        line-height: 1.5;
      }
      .bi {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        border-top: 1px solid var(--rule);
        padding: 5px 0;
        font-size: 11.5px;
      }
      .bi .loc {
        font-weight: 700;
      }
      .bi .bipop {
        color: var(--sub);
        white-space: nowrap;
      }
      #drillDonut {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 6px 0 12px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 4px;
      }
      #drillDonut svg {
        flex: none;
      }
      .donut-legend {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .donut-legend .dl-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--ink-2);
      }
      .donut-legend .dl-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .donut-legend .dl-name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .donut-legend .dl-cnt {
        font-family: var(--mono);
        color: var(--sub);
        flex: none;
      }
      .donut-center-label {
        font-size: 17px;
        font-weight: 800;
        fill: var(--ink);
      }
      .donut-center-sub {
        font-size: 8.5px;
        fill: var(--faint);
      }

      /* ── 지도 ── */
      .maphead {
        padding: 0;
        border-bottom: none;
        display: none;
        flex: none;
        z-index: 5;
        background: var(--ink);
      }
      .maphead h2 {
        display: none;
      }
      .maphead .sub {
        display: none;
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chk {
        font-size: 22px;
        color: var(--sub);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .bar .chk {
        color: rgba(255, 255, 255, 0.82);
      }
      .bar .chk input {
        width: 22px;
        height: 22px;
      }
      select {
        border: 1px solid var(--rule);
        background: var(--card);
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 22px;
        color: var(--ink-2);
        cursor: pointer;
      }

      .stage {
        flex: 1;
        min-height: 0;
        padding: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── 지도 위 오버레이 패널 (매트릭스: 좌측 상단 / 통계: 우측 상단) ── */
      .panel {
        position: absolute;
        top: 15px;
        z-index: 15;
        max-width: 340px;
      }
      .panel-matrix {
        left: 20px;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(22, 32, 42, 0.14);
        padding: 16px 17px;
        max-height: calc(100% - 60px);
        overflow: auto;
      }
      .panel-stats {
        right: 20px;
        width: 300px;
        max-width: 300px;
        height: calc(100% - 98px);
        max-height: calc(100% - 98px);
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .panel-stats .stats {
        margin: 0;
        flex: none;
        gap: 8px;
      }
      .panel-stats .stats > * {
        box-shadow: 0 6px 18px rgba(22, 32, 42, 0.1);
        flex: 1 1 0;
        min-width: 0;
        width: 0;
        padding: 8px 8px;
      }
      .panel-stats .lb {
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: clip;
      }
      .panel-stats .vl {
        font-size: 18px;
        white-space: nowrap;
      }
      .chart-sec {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .chart-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 10px;
      }
      #guChart {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 13px 12px;
      }
      .bar-row .bar-label {
        width: 54px;
        flex: none;
        color: var(--ink);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar-row .bar-track {
        flex: 1;
        height: 16px;
        background: var(--paper);
        border-radius: 5px;
        overflow: hidden;
      }
      .bar-row .bar-fill {
        height: 100%;
        border-radius: 5px;
        background: #2f6fed;
      }
      .bar-row .bar-val {
        width: 50px;
        flex: none;
        text-align: right;
        font-family: var(--mono);
        color: var(--ink-2);
        font-weight: 700;
        font-size: 16px;
      }
      /* ── 지도: 항상 viewCore 고정, 구 클릭 시 transform으로 확대(focus+context) ── */
      .stage {
        position: relative;
      }
      .stage > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .gu path {
        stroke: #fff;
        stroke-width: 1.8;
        cursor: pointer;
        transition:
          opacity 0.5s ease,
          filter 0.5s ease,
          stroke-width 0.16s;
        vector-effect: non-scaling-stroke;
      }
      .gu:hover path {
        stroke: var(--ink);
      }
      .gu.on path {
        stroke: var(--ink);
        stroke-width: 2.4;
      }
      /* 확대된 상태에서는 선택된 구 테두리를 강조하지 않는다 —
         화면 가득 확대된 도형에 굵은 검은 테두리가 그대로 남아 지저분해 보이므로,
         옆 구와 같은 흰색 경계선으로 되돌린다. */
      body.zoomed .gu.on path,
      body.zoomed .gu.sel path {
        stroke: #fff;
        stroke-width: 1.8;
      }
      /* 확대 시 주변 구: 회색·반투명으로 맥락만 남긴다 */
      .gu.dim path {
        opacity: 0.22;
        filter: grayscale(0.7) brightness(1.04);
      }
      .gu.dim:hover path {
        stroke: #fff;
      }
      .gu.sel path {
        pointer-events: none;
      }
      /* 배경 처리 옵션: 회색 면 대신 윤곽선만 (필요 시 body.outline으로 전환) */
      body.outline .gu.dim path {
        opacity: 1;
        filter: none;
        fill: transparent;
        stroke: #d3d9dd;
        stroke-width: 1.2;
      }

      .lbl {
        cursor: pointer;
        transition: opacity 0.35s;
      }
      .lbl text {
        pointer-events: none;
        text-anchor: middle;
        fill: var(--ink);
      }
      .lbl rect {
        pointer-events: none;
      }
      .gname {
        font-size: 21px;
        font-weight: 700;
      }
      .gnum {
        font-size: 14px;
        font-family: var(--mono);
        opacity: 0.65;
      }
      body.zoomed .lbl {
        opacity: 0;
        pointer-events: none;
      }

      /* ── 군위군 인셋 (본지도 비율과 무관하게 별도 축척으로 우측 상단에 표시) ── */
      .insetUI {
        transition: opacity 0.4s;
      }
      .insetUI .frame {
        fill: #fff;
        stroke: #c7cdd2;
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        vector-effect: non-scaling-stroke;
      }
      .insetUI .cap {
        font-size: 10.5px;
        fill: var(--sub);
        font-weight: 600;
      }
      body.zoomed .insetUI {
        opacity: 0.2;
      }
      body.gwzoom .insetUI {
        opacity: 0;
      }
      body.noinset .insetUI,
      body.noinset .gu-gw {
        display: none;
      }

      /* ── 동 레이어 (확대 후 나타남) ── */
      .dongLayer path {
        stroke: #fff;
        stroke-width: 1.1;
        cursor: pointer;
        transition: filter 0.12s;
        vector-effect: non-scaling-stroke;
      }
      .dongLayer path:hover {
        filter: brightness(0.92);
      }
      .dongLayer path.sel {
        filter: brightness(0.8);
      }
      .dong-label {
        pointer-events: none;
        text-anchor: middle;
        dominant-baseline: middle;
        font-weight: 700;
        fill: var(--ink);
        paint-order: stroke;
        stroke: #fff;
        stroke-linejoin: round;
      }

      /* ── 뒤로가기 버튼 ── */
      .backbtn {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 6;
        display: none;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--rule);
        background: var(--card);
        border-radius: 9px;
        padding: 8px 13px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(22, 32, 42, 0.12);
      }
      .backbtn:hover {
        border-color: var(--ink);
      }
      body.zoomed .backbtn {
        display: inline-flex;
      }

      /* ── 우측(또는 하단) 대시보드 패널: 구 확대 시 화면 반절을 채운다 ── */
      .gupanel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 50%;
        z-index: 5;
        background: var(--paper);
        border-left: 1px solid var(--rule);
        box-shadow: -14px 0 30px rgba(22, 32, 42, 0.1);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px 18px;
        overflow: auto;
        transform: translateX(103%);
        transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.12s;
      }
      body.zoomed.haspanel .gupanel {
        transform: none;
      }
      .gp-head {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .gp-head h3 {
        margin: 0;
        font-size: 19px;
      }
      .gp-head .cap {
        font-size: 11.5px;
        color: var(--faint);
      }
      .gp-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.3fr 1fr;
        gap: 12px;
      }
      .gp-card.wide {
        grid-column: 1 / -1;
      }
      .gp-card {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 11px;
        padding: 14px 16px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .gp-card .cap {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-2);
        margin-bottom: 8px;
      }
      .gp-lg {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 12px;
        font-size: 11.5px;
        color: var(--ink-2);
      }
      .gp-lg .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        box-shadow: inset 0 0 0 1px rgba(22, 32, 42, 0.18);
      }
      /* 동별 세로 막대그래프 */
      .vchart {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-end;
        gap: 5px;
        padding: 2px 2px 98px;
      }
      .vbar {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: flex-end;
        position: relative;
        cursor: pointer;
      }
      .vbar i {
        display: block;
        width: 100%;
        border-radius: 4px 4px 0 0;
        min-height: 3px;
        box-shadow: inset 0 0 0 1px rgba(22, 32, 42, 0.12);
      }
      .vbar:hover i,
      .vbar.sel i {
        filter: brightness(0.88);
      }
      .vbar.sel i {
        outline: 2px solid var(--ink);
        outline-offset: -2px;
      }
      .vbar .lb {
        position: absolute;
        top: calc(100% + 5px);
        left: 50%;
        transform: translateX(-50%);
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        max-height: 92px;
        overflow: hidden;
        white-space: nowrap;
      }
      /* 하단 카드: 교사비 반원 게이지 · 충원율 도넛 */
      .gp-dial {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gp-dial svg {
        width: 100%;
        height: 100%;
        max-height: 210px;
      }
      .gp-donutwrap {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .gp-dstats {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        color: var(--ink-2);
      }
      .gp-dstats > div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 0;
        white-space: nowrap;
      }
      .gp-dstats b {
        font-weight: 800;
      }
      .gp-delta {
        margin-top: 7px;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.3;
        white-space: normal !important;
      }
      .gp-delta.pos {
        color: #1d8a4e;
      }
      .gp-delta.neg {
        color: #c42b2b;
      }

      body.zoomed .panel-matrix,
      body.zoomed .panel-stats {
        display: none;
      }
